[build-system]
requires = ["setuptools>=77.0.3", "numpy>=1.24.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyhlicorn"
version = "0.1.1"
description = "Efficient cooperative gene regulatory network inference in Python"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
authors = [
    {name = "Wajdi Dhifli", email = "wajdi.dhifli@univ-lille.fr"},
    {name = "Mohammad AbuAwad", email = "202410475@uopstd.edu.jo"},
    {name = "Jeeda Kotob", email = "jk8835@rit.edu"},
    {name = "Nour Elislem Karabadji", email = "n.karabadji@ensti-annaba.dz"},
    {name = "Ali Assi", email = "Ali.Assi@rit.edu"},
    {name = "Mohamed Elati", email = "mohamed.elati@univ-lille.fr"},
]
maintainers = [
    {name = "Wajdi Dhifli", email = "wajdi.dhifli@univ-lille.fr"},
]
keywords = [
    "gene regulatory networks",
    "systems biology",
    "bioinformatics",
    "transcription factors",
    "cooperativity",
    "pattern mining"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "joblib>=1.3.0",
    "numpy>=1.24.0,<3.0.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "statsmodels>=0.14.0",
    "tqdm>=4.66.0"
]

[project.optional-dependencies]
spark = ["pyspark>=3.5.0"]
monitor = ["psutil>=5.9"]

[project.scripts]
pyhlicorn = "pyhlicorn.cli:main"

[project.urls]
Homepage = "https://github.com/wajdidhifli/PyHLicorn"
Repository = "https://github.com/wajdidhifli/PyHLicorn"
Issues = "https://github.com/wajdidhifli/PyHLicorn/issues"

# Package discovery and bundled data
[tool.setuptools.packages.find]
include = ["pyhlicorn", "pyhlicorn.*"]
namespaces = false

[tool.setuptools.package-data]
pyhlicorn = ["data/*"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"

[tool.cibuildwheel]
skip = "*-win32 *_i686 pp* cp36-* cp37-* cp38-* cp39-* *_universal2"
test-requires = ["pytest"]
test-command = "pytest {project}/tests"
manylinux-x86_64-image = "manylinux_2_28"
